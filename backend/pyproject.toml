[project]
name = "neuroroute-backend"
version = "0.1.0"
description = "NeuroRoute local API (localhost only)"
requires-python = ">=3.13"
dependencies = ["fastapi", "uvicorn", "websockets", "pydantic-settings", "firebase-admin", "networkx", "numpy", "gymnasium", "openai"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff", "hypothesis"]
rl = ["torch", "stable-baselines3", "sb3-contrib", "mlflow", "pandas", "pyarrow"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
